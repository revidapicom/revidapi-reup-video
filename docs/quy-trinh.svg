    <g transform="translate(576,70)"><rect width="160" height="92" rx="10" fill="#fff8e6" stroke="#e0b44a"/><text x="14" y="28" font-weight="700" fill="#1d2b22">Cổng duyệt</text><text x="14" y="52" fill="#4a5a50">báo ước tính credit,</text><text x="14" y="74" fill="#4a5a50">chờ bạn --dong-y</text></g>
    <g transform="translate(760,70)"><rect width="176" height="92" rx="10" fill="#fff" stroke="#c9d3cc"/><text x="14" y="28" font-weight="700" fill="#1d2b22">4. Giọng + dựng</text><text x="14" y="52" fill="#4a5a50">TTS RevidAPI, phụ đề,</text><text x="14" y="74" fill="#4a5a50">mp4 dọc 1080×1920</text></g>
