    <g transform="translate(208,70)"><rect width="160" height="92" rx="10" fill="#fff" stroke="#c9d3cc"/><text x="14" y="28" font-weight="700" fill="#1d2b22">2. Phân tích</text><text x="14" y="52" fill="#4a5a50">cắt cảnh, Whisper,</text><text x="14" y="74" fill="#4a5a50">đo nhịp — trên máy</text></g>
